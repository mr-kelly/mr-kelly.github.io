  <p class="lede" data-i18n="lede">给老板和 HR 负责人的一套可直接使用的面试工具。不是文章——选好岗位和层级，它会给你简历追问、品味测试题、现场评分表，以及一份可以打印带进会议室的面试脚本。</p>
