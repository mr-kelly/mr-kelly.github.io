<script>
/* ======================================================================

   Open Extended Jungian Type Scales 1.2 (OEJTS 1.2), Eric Jorgenson,

const ITEMS = [
  { l:{ zh:"喜欢列清单",                 en:"makes lists" },                          r:{ zh:"靠记性就行",                 en:"relies on memory" } },
  { l:{ zh:"习惯先怀疑",                 en:"sceptical" },                            r:{ zh:"愿意先相信",                 en:"wants to believe" } },
  { l:{ zh:"独处久了会无聊",             en:"bored by time alone" },                  r:{ zh:"需要独处的时间",             en:"needs time alone" } },
  { l:{ zh:"接受事情本来的样子",         en:"accepts things as they are" },           r:{ zh:"总觉得事情不该是这样",       en:"unsatisfied with the ways things are" } },
  { l:{ zh:"房间收拾得干净",             en:"keeps a clean room" },                   r:{ zh:"东西随手一放",               en:"just puts stuff where ever" } },
  { l:{ zh:"觉得说人“像机器”是句贬义",   en:"thinks “robotic” is an insult" },        r:{ zh:"追求头脑像机器一样精准",     en:"strives to have a mechanical mind" } },
  { l:{ zh:"精力旺盛",                   en:"energetic" },                            r:{ zh:"慢悠悠的",                   en:"mellow" } },
  { l:{ zh:"更愿意考选择题",             en:"prefer to take multiple choice test" },  r:{ zh:"更愿意写论述题",             en:"prefer essay answers" } },
  { l:{ zh:"乱糟糟",                     en:"chaotic" },                              r:{ zh:"有条理",                     en:"organized" } },
  { l:{ zh:"容易受伤",                   en:"easily hurt" },                          r:{ zh:"皮实、不太往心里去",         en:"thick-skinned" } },
  { l:{ zh:"在团队里状态最好",           en:"works best in groups" },                 r:{ zh:"一个人做事状态最好",         en:"works best alone" } },
  { l:{ zh:"注意力在当下",               en:"focused on the present" },               r:{ zh:"注意力在未来",               en:"focused on the future" } },
  { l:{ zh:"提前很久做计划",             en:"plans far ahead" },                      r:{ zh:"临到头才做计划",             en:"plans at the last minute" } },
  { l:{ zh:"希望被人尊重",               en:"wants people’s respect" },               r:{ zh:"希望被人喜爱",               en:"wants their love" } },
  { l:{ zh:"聚会让我累",                 en:"gets worn out by parties" },             r:{ zh:"聚会让我兴奋",               en:"gets fired up by parties" } },
  { l:{ zh:"融入人群",                   en:"fits in" },                              r:{ zh:"跳出人群",                   en:"stands out" } },
  { l:{ zh:"留着多种选择",               en:"keeps options open" },                   r:{ zh:"定下来就不再改",             en:"commits" } },
  { l:{ zh:"想擅长把东西修好",           en:"wants to be good at fixing things" },    r:{ zh:"想擅长把人修好",             en:"wants to be good at fixing people" } },
  { l:{ zh:"说得多",                     en:"talks more" },                           r:{ zh:"听得多",                     en:"listens more" } },
  { l:{ zh:"讲一件事，会说发生了什么",   en:"when describing an event, will tell people what happened" }, r:{ zh:"讲一件事，会说它意味着什么", en:"when describing an event, will tell people what it meant" } },
  { l:{ zh:"事情马上就做掉",             en:"gets work done right away" },            r:{ zh:"能拖就拖",                   en:"procrastinates" } },
  { l:{ zh:"跟着心走",                   en:"follows the heart" },                    r:{ zh:"跟着脑子走",                 en:"follows the head" } },
  { l:{ zh:"待在家里",                   en:"stays at home" },                        r:{ zh:"出门浪",                     en:"goes out on the town" } },
  { l:{ zh:"想要大图景",                 en:"wants the big picture" },                r:{ zh:"想要具体细节",               en:"wants the details" } },
  { l:{ zh:"临场发挥",                   en:"improvises" },                           r:{ zh:"提前准备",                   en:"prepares" } },
  { l:{ zh:"道德建立在公正之上",         en:"bases morality on justice" },            r:{ zh:"道德建立在怜悯之上",         en:"bases morality on compassion" } },
  { l:{ zh:"很难大声喊出来",             en:"finds it difficult to yell very loudly" }, r:{ zh:"隔老远冲人喊，很自然",     en:"yelling to others when they are far away comes naturally" } },
  { l:{ zh:"偏理论",                     en:"theoretical" },                          r:{ zh:"偏实证",                     en:"empirical" } },
  { l:{ zh:"拼命工作",                   en:"works hard" },                           r:{ zh:"拼命玩",                     en:"plays hard" } },
  { l:{ zh:"谈情绪让我不自在",           en:"uncomfortable with emotions" },          r:{ zh:"重视情绪",                   en:"values emotions" } },
  { l:{ zh:"喜欢在人前表演",             en:"likes to perform in front of other people" }, r:{ zh:"回避公开发言",           en:"avoids public speaking" } },
  { l:{ zh:"想知道“谁、什么、何时”",     en:"likes to know “who?”, “what?”, “when?”" }, r:{ zh:"想知道“为什么”",           en:"likes to know “why?”" } }
];

/* OEJTS 1.2 官方计分式（Q 编号从 1 开始）
   IE = 30 - Q3 - Q7 - Q11 + Q15 - Q19 + Q23 + Q27 - Q31
   SN = 12 + Q4 + Q8 + Q12 + Q16 + Q20 - Q24 - Q28 + Q32
   FT = 30 - Q2 + Q6 + Q10 - Q14 - Q18 + Q22 - Q26 - Q30
   JP = 18 + Q1 + Q5 - Q9 + Q13 - Q17 + Q21 - Q25 + Q29
   每条取值域 8–40，中点 24；> 24 取 E / N / T / P，否则取 I / S / F / J */
const KEY = {
  IE: { base: 30, w: { 3:-1, 7:-1, 11:-1, 15:+1, 19:-1, 23:+1, 27:+1, 31:-1 }, hi:"E", lo:"I", left:"E" },
  SN: { base: 12, w: { 4:+1, 8:+1, 12:+1, 16:+1, 20:+1, 24:-1, 28:-1, 32:+1 }, hi:"N", lo:"S", left:"S" },
  FT: { base: 30, w: { 2:-1, 6:+1, 10:+1, 14:-1, 18:-1, 22:+1, 26:-1, 30:-1 }, hi:"T", lo:"F", left:"T" },
  JP: { base: 18, w: { 1:+1, 5:+1, 9:-1, 13:+1, 17:-1, 21:+1, 25:-1, 29:+1 }, hi:"P", lo:"J", left:"J" }
};
const DIMS = ["IE", "SN", "FT", "JP"];

const AXIS = {

/* ===================== 状态与工具 ===================== */
let LANG = "zh";
let T = I18N.zh;
const answers = new Array(ITEMS.length).fill(null);
let cur = 0;

const $ = id => document.getElementById(id);
const screens = { intro: $("screen-intro"), quiz: $("screen-quiz"), result: $("screen-result") };

function show(which) {
  Object.keys(screens).forEach(k => screens[k].classList.toggle("hidden", k !== which));
  window.scrollTo(0, 0);
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ===================== 计分（OEJTS 1.2 原式） ===================== */
function score() {
  const out = { code: "", raw: {}, leftPct: {} };
  DIMS.forEach(d => {
    const k = KEY[d];
    let sum = k.base;
    for (const q in k.w) sum += k.w[q] * (answers[Number(q) - 1] == null ? 3 : answers[Number(q) - 1]);
    out.raw[d] = sum;
    const letter = sum > 24 ? k.hi : k.lo;
    out.code += letter;
    // 归一到 0-100：hi 端的比例
    const hiPct = ((sum - 8) / 32) * 100;
    out.leftPct[d] = (k.left === k.hi) ? hiPct : 100 - hiPct;
  });
  return out;
}

/* ===================== 渲染 ===================== */
function renderScale() {
  const box = $("scale");
  box.innerHTML = "";
  for (let v = 1; v <= 5; v++) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.v = v;
    b.innerHTML = '<span class="dot"></span>';
    b.addEventListener("click", () => answer(v));
    box.appendChild(b);
  }
}

function renderQuestion() {
  const it = ITEMS[cur];
  $("pole-l").textContent = it.l[LANG];
  $("pole-r").textContent = it.r[LANG];
  $("progress-text").textContent = T.qOf(cur + 1, ITEMS.length);
  const pct = Math.round((cur / ITEMS.length) * 100);
  $("progress-pct").textContent = pct + "%";
  $("progress-fill").style.width = pct + "%";
  $("btn-back").disabled = cur === 0;
  const btns = $("scale").children;
  for (let i = 0; i < btns.length; i++) {
    btns[i].setAttribute("aria-label", (i < 2 ? it.l[LANG] : i > 2 ? it.r[LANG] : T.endLeft + " / " + T.endRight));
  }
}

function answer(v) {
  answers[cur] = v;
  if (cur < ITEMS.length - 1) { cur++; renderQuestion(); }
  else finish();
}

function renderAxes(res) {
  const box = $("r-axes");
  box.innerHTML = "";
  DIMS.forEach(d => {
    const lab = AXIS[d][LANG];
    const p = Math.round(res.leftPct[d]);
    const leftOn = res.code.indexOf(KEY[d].left) !== -1;
    const strength = Math.abs(p - 50) * 2;
    const hint = strength < 16 ? T.hint[0] : strength < 45 ? T.hint[1] : T.hint[2];
    const el = document.createElement("div");
    el.innerHTML =
      '<div class="axis-labels">' +
        '<span class="' + (leftOn ? "on" : "off") + '">' + esc(lab.a) + " · " + p + "%</span>" +
        '<span class="' + (leftOn ? "off" : "on") + '">' + esc(lab.b) + " · " + (100 - p) + "%</span>" +
      "</div>" +
      '<div class="axis-track"><div class="axis-fill" style="' +
        (leftOn ? "left:0;width:" + p + "%" : "right:0;width:" + (100 - p) + "%") + '"></div></div>' +
      '<div class="axis-hint">' + esc(lab.name) + " — " + esc(hint) +
        ' <span class="axis-raw">(' + d + " " + T.rawLabel + " " + res.raw[d] + "/40)</span></div>";
    box.appendChild(el);
  });
}

function renderType(code, res) {
  const t = TYPES[code], c = t[LANG];
  $("r-code").textContent = code;
  $("r-name").textContent = c.name;
  $("r-group").textContent = c.gn + " · " + t.g;
  $("r-tagline").textContent = c.tag;
  $("r-about").textContent = c.about;
  $("r-advice").textContent = c.adv;
  $("r-strengths").innerHTML = c.s.map(x => "<li>" + esc(x) + "</li>").join("");
  $("r-blind").innerHTML = c.b.map(x => "<li>" + esc(x) + "</li>").join("");
  $("r-careers").innerHTML = c.c.map(x => "<li>" + esc(x) + "</li>").join("");

  if (res) {
    $("r-axes-title").textContent = T.axesTitle;
    renderAxes(res);
  } else {
    $("r-axes-title").textContent = T.axesBrowseTitle;
    $("r-axes").innerHTML = '<p style="color:var(--kelly-muted,#687069);font-size:14px;margin:0">' +
      esc(T.browseNote(code)) + '<button class="link-btn" id="btn-go-quiz">' + esc(T.browseCta) + "</button>" +
      esc(T.browseNoteTail) + "</p>";
    const go = $("btn-go-quiz");
    if (go) go.addEventListener("click", startQuiz);
  }
  document.querySelectorAll("#type-grid-result button").forEach(b => {
    b.classList.toggle("is-current", b.querySelector(".code").textContent === code);
  });
  window.__lastCode = code;
  window.__lastRes = res;
}

function finish() {
  const res = score();
  renderType(res.code, res);
  show("result");
  setHash(res.code);
}

function startQuiz() {
  answers.fill(null);
  cur = 0;
  window.__lastRes = null;
  window.__lastCode = null;
  renderQuestion();
  show("quiz");
  setHash("");
}

function setHash(h) {
  try { history.replaceState(null, "", location.pathname + location.search + (h ? "#" + h : "")); } catch (e) {}
}

function buildGrid(el) {
  el.innerHTML = "";
  Object.keys(TYPES).forEach(code => {
    const t = TYPES[code];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "g-" + t.g;
    b.innerHTML = '<span class="code">' + code + '</span><span class="nm">' + esc(t[LANG].name) + "</span>";
    b.addEventListener("click", () => { renderType(code, null); show("result"); setHash(code); });
    el.appendChild(b);
  });
}

/* ===================== 语言 ===================== */
function applyLang(lang, push) {
  LANG = (lang === "en") ? "en" : "zh";
  T = I18N[LANG];
  document.documentElement.lang = T.htmlLang;
  document.title = T.title;

  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = T[el.dataset.i]; });
  $("facts").innerHTML = T.facts.map(x => "<li>" + esc(x) + "</li>").join("");
  $("before-list").innerHTML = T.before.map(x => "<li>" + x + "</li>").join("");
  $("faq").innerHTML = T.faq.map(p => "<dt>" + esc(p[0]) + "</dt><dd>" + esc(p[1]) + "</dd>").join("");

  document.querySelectorAll(".lang-switch button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));
  });
  const canon = "https://kellychan.im/mbti/" + (LANG === "en" ? "?lang=en" : "");
  $("canonical").setAttribute("href", canon);

  buildGrid($("type-grid-intro"));
  buildGrid($("type-grid-result"));
  renderScale();

  if (!screens.quiz.classList.contains("hidden")) renderQuestion();
  if (window.__lastCode) renderType(window.__lastCode, window.__lastRes);

  if (push) {
    const url = location.pathname + (LANG === "en" ? "?lang=en" : "") + location.hash;
    try { history.replaceState(null, "", url); } catch (e) {}
    try { localStorage.setItem("mbti-lang", LANG); } catch (e) {}
  }
}

/* ===================== 复制 ===================== */
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}

function copyResult() {
  const code = window.__lastCode, res = window.__lastRes;
  if (!code) return;
  const c = TYPES[code][LANG];
  let text = T.copyLead + code + " (" + c.name + ")\n" + c.tag + "\n";
  if (res) {
    text += "\n";
    DIMS.forEach(d => {
      const lab = AXIS[d][LANG], p = Math.round(res.leftPct[d]);
      text += lab.a + " " + p + "% / " + lab.b + " " + (100 - p) + "%  (" + d + " " + T.rawLabel + " " + res.raw[d] + "/40)\n";
    });
  }
  text += "\nOEJTS 1.2 (Eric Jorgenson, 2015, CC BY-NC-SA 4.0)\n" +
          T.copyTail + location.origin + location.pathname + (LANG === "en" ? "?lang=en" : "");

  const done = () => toast(T.copied);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, cb) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); cb(); } catch (e) { toast(T.copyFail); }
  document.body.removeChild(ta);
}

/* ===================== 绑定与启动 ===================== */
$("btn-start").addEventListener("click", startQuiz);
$("btn-restart").addEventListener("click", startQuiz);
$("btn-abort").addEventListener("click", () => show("intro"));
$("btn-back").addEventListener("click", () => { if (cur > 0) { cur--; renderQuestion(); } });
$("btn-copy").addEventListener("click", copyResult);
document.querySelectorAll(".lang-switch button").forEach(b => {
  b.addEventListener("click", () => applyLang(b.dataset.lang, true));
});

document.addEventListener("keydown", e => {
  if (screens.quiz.classList.contains("hidden")) return;
  if (e.key >= "1" && e.key <= "5") answer(Number(e.key));
  if (e.key === "ArrowLeft" && cur > 0) { cur--; renderQuestion(); }
});

/* 初始语言：URL 参数 > 本地记忆 > 浏览器语言 */
(function initLang() {
  const param = new URLSearchParams(location.search).get("lang");
  let lang = null;
  if (param === "en" || param === "zh") lang = param;
  if (!lang) { try { lang = localStorage.getItem("mbti-lang"); } catch (e) {} }
  if (!lang) lang = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  applyLang(lang, false);
})();

function applyHash() {
  const h = (location.hash || "").replace("#", "").toUpperCase();
  if (TYPES[h] && h !== window.__lastCode) { renderType(h, null); show("result"); }
}
window.addEventListener("hashchange", applyHash);
applyHash();
</script>
